<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Phone Input</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
<div class="container">
    <div class="phone-card">
        <h3>Phone Number</h3>
        <p class="phone-description">Select your country and enter your mobile number.</p>

        <form id="phoneForm">
            <label for="phoneNumber" class="phone-label">Mobile Number</label>

            <div class="custom-phone">
                <button type="button" class="country-button" id="countryButton">
                    <img src="" class="country-flag" id="selectedFlag" alt="">
                    <span class="country-code" id="selectedCode"></span>
                    <i class="bi bi-chevron-down country-arrow"></i>
                </button>

                <input type="tel" id="phoneNumber" class="phone-number"
                       placeholder="Enter mobile number" autocomplete="tel" inputmode="numeric">

                <div class="country-dropdown" id="countryDropdown">
                    <div class="country-search">
                        <i class="bi bi-search"></i>
                        <input type="text" id="countrySearch"
                               placeholder="Search country or code..." autocomplete="off">
                    </div>
                    <div class="country-list" id="countryList"></div>
                </div>
            </div>

            <div class="phone-error" id="phoneError"></div>
            <div class="phone-success" id="phoneSuccess"></div>

            <input type="hidden" name="country_name" id="countryName" value="India">
            <input type="hidden" name="country_code" id="countryCode" value="+91">
            <input type="hidden" name="phone" id="hiddenPhone">
            <input type="hidden" name="full_phone" id="fullPhone">

            <button type="submit" class="submit-btn">Continue</button>
        </form>

        <div class="result-box" id="resultBox">
            <div class="result-row">
                <span class="result-label">Country</span>
                <span class="result-value" id="resultCountry"></span>
            </div>
            <div class="result-row">
                <span class="result-label">Country Code</span>
                <span class="result-value" id="resultCode"></span>
            </div>
            <div class="result-row">
                <span class="result-label">Phone</span>
                <span class="result-value" id="resultPhone"></span>
            </div>
            <div class="result-row">
                <span class="result-label">Full Phone</span>
                <span class="result-value" id="resultFull"></span>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/phone-input.js"></script>
</body>
</html>
